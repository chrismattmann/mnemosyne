<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Mannaz. Weighted for sixteen pixels rather than scaled to it: at that
    size the primary mark's counters close and the rune reads as a smudge.
  -->
  <g fill="none" stroke="#C0552B" stroke-width="12" stroke-linecap="square">
    <path d="M26 20 V 80"/>
    <path d="M74 20 V 80"/>
    <path d="M26 20 L 74 50"/>
    <path d="M74 20 L 26 50"/>
  </g>
</svg>
