name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: JDK 21 Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out Mnemosyne
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: pcs/opsui/src/main/webapp/resources/package-lock.json

      # java.ext.dirs and java.endorsed.dirs were removed in Java 9, and a JVM
      # given either one refuses to start. Every launcher script in the tree
      # passed one until #75. The file count is asserted first so that a scan
      # which matched nothing cannot pass for a clean tree.
      - name: Check for JVM flags removed in Java 9
        run: |
          set -e
          # .github is skipped because this step names the flags itself.
          scan() {
            find . -path ./.git -prune -o -path ./.github -prune \
                 -o -path '*/target' -prune -o -type f -print
          }
          FILES=$(scan | wc -l)
          echo "scanning $FILES files"
          test "$FILES" -gt 1000
          if scan | xargs grep -l 'java\.ext\.dirs\|java\.endorsed\.dirs' 2>/dev/null | grep .; then
            echo "::error::the files above use a JVM flag removed in Java 9; use -cp instead"
            exit 1
          fi
          echo "no removed JVM flags present"

      # The reactor builds and tests every module. Deploy and signing live in
      # the release profile and are deliberately not exercised here; a pull
      # request should never need a GPG key to go green.
      #
      # install, not test, because that is what the README tells contributors
      # to run and the two are not the same build. For a pom-packaging module
      # the test lifecycle never resolves compile-scope dependencies, so a
      # broken dependency there is invisible: oodt-deployment passed `clean
      # test` and failed `clean install` on the very same tree.
      - name: Build and test
        run: mvn -B clean install

      - name: Generate and verify RADiX with Docker Compose
        timeout-minutes: 20
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          mvn -B -ntp org.apache.maven.plugins:maven-archetype-plugin:3.4.1:generate \
            -DarchetypeGroupId=ai.mattmann.mnemosyne \
            -DarchetypeArtifactId=radix-archetype -DarchetypeVersion=1.11.0 \
            -DarchetypeCatalog=local -Doodt=1.11.0 \
            -DgroupId=example -DartifactId=radix-ci -Dversion=1.0-SNAPSHOT
          cd radix-ci
          trap 'docker compose --profile "*" down --volumes' EXIT
          # Compile real source: an empty generated project does not exercise javac.
          mkdir -p extensions/src/main/java
          printf '%s\n' 'public record RadixCompileCheck(String value) {}' > extensions/src/main/java/RadixCompileCheck.java
          mvn -B -ntp clean package
          sh docker/verify.sh

      # Several suites in this repository start real servers on fixed ports
      # and write into temporary directories. When one of them fails, the
      # stack trace in the log is rarely the whole story, so keep the reports.
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 14
