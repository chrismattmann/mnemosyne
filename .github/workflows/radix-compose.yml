name: RADiX Docker Compose

# Run from the Actions page when validating runtime or release changes.
# Image pulls and Docker availability do not gate the normal Build workflow.
on:
  workflow_dispatch:

jobs:
  verify:
    name: RADiX integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out Mnemosyne
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: pcs/opsui/src/main/webapp/resources/package-lock.json

      # Generation uses the local catalog: install this checkout's modules and
      # archetype first. The archetype is not published to Maven Central.
      - name: Build and install Mnemosyne
        run: mvn -B clean install

      - name: Generate and verify RADiX with Docker Compose
        timeout-minutes: 20
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          # The launcher gets its version from the preceding Maven build.
          sh "$GITHUB_WORKSPACE/mvn/archetypes/radix/target/classes/bin/radix" \
            -B -ntp -DgroupId=example -DartifactId=radix-compose
          cd radix-compose
          trap 'docker compose --profile "*" down --volumes' EXIT
          mvn -B -ntp clean package
          sh docker/verify.sh

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 14
