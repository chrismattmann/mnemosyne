# Run `mvn clean package`, then `docker compose up --build --wait`.
# RPC ports stay on the Compose network; the dashboard is local to this machine.
x-runtime: &runtime
  init: true
  restart: unless-stopped
  environment:
    JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2 -Xmx512m
  volumes:
    - data:/oodt/data
  healthcheck:
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 15s

services:
  filemgr:
    <<: *runtime
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: filemgr
    healthcheck:
      test: [CMD, bash, -c, 'true </dev/tcp/127.0.0.1/9000']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  workflow:
    <<: *runtime
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: workflow
    environment:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2 -Xmx512m
      # Execute tasks in this container. A remote worker is not part of this starter.
      RESMGR_URL: ''
    healthcheck:
      test: [CMD, bash, -c, 'true </dev/tcp/127.0.0.1/9002']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  resmgr:
    <<: *runtime
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: resmgr
    healthcheck:
      test: [CMD, bash, -c, 'true </dev/tcp/127.0.0.1/9001']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  opsui:
    <<: *runtime
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: opsui
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      filemgr:
        condition: service_healthy
      workflow:
        condition: service_healthy
      resmgr:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '5', 'http://localhost:8080/pcs/services/workflow/definitions']
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s

  crawler:
    <<: *runtime
    profiles: [crawler]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: crawler
    environment:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2 -Xmx512m
      FILEMGR_URL: http://filemgr:9000
      WORKFLOW_URL: http://workflow:9002
      FAILURE_DIR: /oodt/data/failure
      BACKUP_DIR: /oodt/data/backup
      PUSHPULL_MET_FILE_EXT: met
    depends_on:
      filemgr:
        condition: service_healthy
    healthcheck:
      test: [CMD, bash, -c, 'true </dev/tcp/127.0.0.1/9020']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  smoke:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: smoke
    environment:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2 -Xmx512m
    volumes:
      - data:/oodt/data
    depends_on:
      opsui:
        condition: service_healthy

volumes:
  data:
